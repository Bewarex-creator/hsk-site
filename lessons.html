<script>
const LESSONS = {
  1: {
    hz:'你好', py:'Nǐ hǎo', ru:'Здравствуй',
    intro:'Первый шаг: приветствия и прощания. В этом уроке — четыре тона пиньиня и первые слова, без которых не начинается ни один разговор.',
    words:[
      { h:'你好', p:'nǐ hǎo', t:'здравствуй' },
      { h:'你',   p:'nǐ',     t:'ты' },
      { h:'您',   p:'nín',    t:'Вы (вежливо)' },
      { h:'好',   p:'hǎo',    t:'хороший; хорошо' },
      { h:'你们', p:'nǐmen',  t:'вы (мн. ч.)' },
      { h:'再见', p:'zàijiàn', t:'до свидания' }
    ],
    dialog:[
      { w:'尼克 Níkè',  zh:'你好！',            p:'Nǐ hǎo!',           ru:'Привет!' },
      { w:'王小云 Wáng Xiǎoyún', zh:'你好！',   p:'Nǐ hǎo!',           ru:'Привет!' },
      { w:'尼克 Níkè',  zh:'老师好！',          p:'Lǎoshī hǎo!',       ru:'Здравствуйте, учитель!' },
      { w:'王老师 Wáng lǎoshī', zh:'你们好！',  p:'Nǐmen hǎo!',        ru:'Здравствуйте, ребята!' },
      { w:'尼克 Níkè',  zh:'王小云，再见！',    p:'Wáng Xiǎoyún, zàijiàn!', ru:'До свидания, Ван Сяоюнь!' },
      { w:'王小云 Wáng Xiǎoyún', zh:'再见！',   p:'Zàijiàn!',          ru:'До свидания!' }
    ],
    grammar:[
      { hz:'你好', t:'Универсальное приветствие', b:'你好 — «здравствуй». Подходит в любое время суток и почти в любой ситуации. В ответ говорят тем же: 你好！', ex:[
        ['老师，你好！','Lǎoshī, nǐ hǎo!','Здравствуйте, учитель!']
      ]},
      { hz:'您', t:'Вежливое «Вы»', b:'您 — вежливая форма «ты». Её используют с учителями, старшими и незнакомыми людьми.', ex:[
        ['您好，王老师！','Nín hǎo, Wáng lǎoshī!','Здравствуйте, учитель Ван!']
      ]},
      { hz:'你们', t:'Множественное число: 们', b:'Частица 们 делает местоимение множественным: 你 → 你们 («вы»). Приветствие группе: 你们好！', ex:[
        ['你们好！','Nǐmen hǎo!','Здравствуйте, ребята!']
      ]},
      { hz:'四个声调', t:'Четыре тона', b:'Слог в китайском языке имеет тон, и тон меняет смысл: mā 妈 «мама», má 麻 «конопля», mǎ 马 «лошадь», mà 骂 «ругать». Тон указывается в пиньине над гласной: nǐ hǎo — оба слога третьего тона.', ex:[
        ['mā má mǎ mà','мā má mǎ mà','мама — конопля — лошадь — ругать']
      ]},
      { hz:'再见', t:'Прощание', b:'再见 буквально «снова увидеться» — стандартное «до свидания». Между знакомыми можно просто сказать 再见 в конце встречи.', ex:[
        ['老师，再见！','Lǎoshī, zàijiàn!','До свидания, учитель!']
      ]}
    ],
    quiz:[
      { q:'Как переводится 你好？', opts:['Здравствуй','До свидания','Спасибо','Извини'], a:'Здравствуй' },
      { q:'Как сказать «Вы» вежливо (учителю, старшим)?', opts:['你','您','你们','他'], a:'您' },
      { q:'«До свидания» по-китайски:', opts:['再见','你好','谢谢','不客气'], a:'再见' },
      { q:'你们好 — это приветствие…', opts:['одного человека','группы людей','вопрос','прощание'], a:'группы людей' },
      { q:'Сколько тонов в китайском языке?', opts:['Два','Три','Четыре','Пять'], a:'Четыре' }
    ]
  },
  2: {
    hz:'谢谢你', py:'Xièxie nǐ', ru:'Спасибо тебе',
    intro:'Вежливость — ключ к китайскому этикету. Урок о благодарности, извинениях и первой тональной песне: 不 меняет тон!',
    words:[
      { h:'谢谢',   p:'xièxie',    t:'спасибо' },
      { h:'不客气', p:'bú kèqi',   t:'не за что' },
      { h:'对不起', p:'duìbuqǐ',   t:'извини(те)' },
      { h:'没关系', p:'méi guānxi', t:'ничего страшного' },
      { h:'不',     p:'bù',        t:'не; нет' }

        ['我晚上十一点睡觉。','Wǒ wǎnshang shíyī diǎn shuìjiào.','Я ложусь спать в одиннадцать вечера.']

      { q:'Как читается 八点十分?', opts:['8:10','8:00','10:08','18:00'], a:'8:10' },
      { q:'晚上 означает…', opts:['вечер','утро','полдень','ночь (поздняя)'], a:'вечер' },
      { q:'Где ставится время перед действием?', opts:['перед глаголом','после глагола','в конце предложения','вместе с 吗'], a:'перед глаголом' }

const FUTURE = [
  { n:12, hz:'明天天气怎么样',   py:'Míngtiān tiānqì zěnmeyàng',   ru:'Какая завтра будет погода',      topic:'Погода и планы.',        pages:'стр. 110–117' },
  { n:13, hz:'他在学做中国菜呢', py:'Tā zài xué zuò Zhōngguó cài ne', ru:'Он учится готовить китайские блюда', topic:'Действие в процессе.', pages:'стр. 118–123' },
  { n:14, hz:'她买了不少衣服',   py:'Tā mǎile bùshǎo yīfu',        ru:'Она купила немало одежды',       topic:'Покупки и одежда.',      pages:'стр. 124–131' },
  { n:15, hz:'我是坐飞机来的',   py:'Wǒ shì zuò fēijī lái de',     ru:'Я прилетел на самолёте',         topic:'Транспорт и рассказ о себе.', pages:'стр. 132–139' }
];

const STORE_KEY = 'hsk-lessons-progress-v2';
let state = { learned:{}, passed:{}, opened:1 };
try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch(e) {}
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {} }
function isUnlocked(n){ return n === 1 || !!state.passed[n-1]; }

const pathBar = document.getElementById('pathBar');
const lessonView = document.getElementById('lessonView');
const futureTitle = document.getElementById('futureTitle');
const futureLessons = document.getElementById('futureLessons');

let currentLesson = null;

function renderPath(){
  pathBar.innerHTML = '';
  for (let n = 1; n <= 11; n++) {
    const L = LESSONS[n];
    const node = document.createElement('div');
    const unlocked = isUnlocked(n);
    const passed = !!state.passed[n];
    node.className = 'path-node ' + (passed ? 'done' : unlocked ? 'open' : 'locked');
    const status = passed ? '✓ пройден' : unlocked ? 'открыт' : 'закрыт';
    node.innerHTML =
      (unlocked ? '' : '<span class="lock">🔒</span>') +
      '<div class="pn-num">УРОК ' + n + '</div>' +
      '<div class="pn-hz">' + L.hz + '</div>' +
      '<div class="pn-ru">' + L.ru + '</div>' +
      '<div class="pn-status">' + status + '</div>';
    if (unlocked) node.addEventListener('click', () => openLesson(n));
    pathBar.appendChild(node);
  }
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openLesson(n){
  currentLesson = n;
  const L = LESSONS[n];
  renderLessonView(n, L);
  lessonView.style.display = 'block';
  lessonView.scrollIntoView({ behavior:'smooth', block:'start' });
  futureTitle.style.display = 'none';
  futureLessons.style.display = 'none';
  document.querySelector('.soon').style.display = 'none';
}

function backToPath(){
  currentLesson = null;
  lessonView.style.display = 'none';
  renderPath();
  futureTitle.style.display = 'flex';
  futureLessons.style.display = 'grid';
  document.querySelector('.soon').style.display = 'block';
}

function renderLessonView(n, L){
  const learnedSet = state.learned[n] || {};
  const learnedCount = L.words.filter(w => learnedSet[w.h]).length;
  const allLearned = learnedCount === L.words.length;
  const passed = !!state.passed[n];

  lessonView.innerHTML =
    '<div class="lv-top">' +
      '<button class="lv-back" id="lvBack">← К пути уроков</button>' +
      '<div class="wp-label">Урок ' + n + ' из 15</div>' +
    '</div>' +
    '<div class="lv-title">' +
      '<div class="hz">' + esc(L.hz) + '</div>' +
      '<div class="py">' + esc(L.py) + '</div>' +
      '<div class="ru">' + esc(L.ru) + '</div>' +
      '<div class="intro">' + esc(L.intro) + '</div>' +
    '</div>' +

    '<div class="sec" id="secWords">' +
      '<div class="sec-head"><span class="sh-hz">生词</span><span class="sh-ru">Слова урока — нажми на карточку, чтобы увидеть перевод</span></div>' +
      '<div class="words-grid" id="wordsGrid"></div>' +
      '<div class="words-progress">' +
        '<div class="wp-bar"><div class="wp-fill" id="wpFill"></div></div>' +
        '<div class="wp-label" id="wpLabel"></div>' +
      '</div>' +
    '</div>' +

    '<div class="sec">' +
      '<div class="sec-head"><span class="sh-hz">对话</span><span class="sh-ru">Диалоги урока</span></div>' +
      '<div class="dlg">' +
        L.dialog.map((d, i) =>
          '<div class="dlg-line' + (i % 2 ? ' alt' : '') + '">' +
            '<div class="dlg-who">' + esc(d.w) + '</div>' +
            '<div class="dlg-zh">' + esc(d.zh) + '</div>' +
            '<div class="dlg-py">' + esc(d.p) + '</div>' +
            '<div class="dlg-ru">' + esc(d.ru) + '</div>' +
          '</div>'
        ).join('') +
      '</div>' +
    '</div>' +

    '<div class="sec">' +
      '<div class="sec-head"><span class="sh-hz">语法</span><span class="sh-ru">Грамматика урока</span></div>' +
      '<div class="gram-grid">' +
        L.grammar.map(g =>
          '<div class="gram-card">' +
            '<div class="g-t"><span class="g-hz">' + esc(g.hz) + '</span><span>' + esc(g.t) + '</span></div>' +
            '<div class="g-b">' + esc(g.b) + '</div>' +
            '<div class="g-ex">' +
              g.ex.map(e =>
                '<div class="g-line">' +
                  '<div class="g-zh">' + esc(e[0]) + '</div>' +
                  '<div class="g-py">' + esc(e[1]) + '</div>' +
                  '<div class="g-ru">' + esc(e[2]) + '</div>' +
                '</div>'
              ).join('') +
            '</div>' +
          '</div>'
        ).join('') +
      '</div>' +
    '</div>' +

    '<div class="sec">' +
      '<div class="sec-head"><span class="sh-hz">练习</span><span class="sh-ru">Тест-допуск к следующему уроку</span></div>' +
      (allLearned
        ? '<div class="quiz-gate ready" id="quizGate">' +
            (passed
              ? '<div>Тест уже пройден — можно двигаться дальше ✓</div>' +
                '<button class="qg-btn" id="qgBtn">Пройти ещё раз</button>'
              : '<div>Все слова выучены! Проверь себя: нужно ' + Math.ceil(L.quiz.length * 0.8) + ' правильных из ' + L.quiz.length + '.</div>' +
                '<button class="qg-btn" id="qgBtn">Начать тест</button>') +
          '</div>' +
          '<div class="quiz-body" id="quizBody">' +
            '<div class="q-progress" id="qProgress"></div>' +
            '<div class="q-text" id="qText"></div>' +
            '<div class="q-opts" id="qOpts"></div>' +
            '<div class="q-result" id="qResult" style="display:none"></div>' +
          '</div>'
        : '<div class="quiz-gate">Тест откроется, когда отметишь все слова урока как выученные (' + learnedCount + ' / ' + L.words.length + '). Открывай карточки и нажимай «выучил».</div>') +
    '</div>' +

    '<div class="lv-next' + (passed ? ' show' : '') + '" id="lvNext">' +
      (n < 11
        ? '<button id="nextLessonBtn">Следующий урок: ' + LESSONS[n+1].hz + ' →</button>'
        : '<button id="nextLessonBtn">Начать путь заново ↺</button>') +
    '</div>';

  document.getElementById('lvBack').addEventListener('click', backToPath);

  renderWords(n, L);
  if (allLearned) {
    document.getElementById('qgBtn').addEventListener('click', () => startQuiz(n, L));
  }
  const nextBtn = document.getElementById('nextLessonBtn');
  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      if (n < 11) openLesson(n + 1);
      else resetProgress();
    });
  }
}

function renderWords(n, L){
  const grid = document.getElementById('wordsGrid');
  const learnedSet = state.learned[n] || {};
  const learnedCount = L.words.filter(x => learnedSet[x.h]).length;
  grid.innerHTML = '';
  L.words.forEach(w => {
    const card = document.createElement('div');
    card.className = 'word-card' + (learnedSet[w.h] ? ' learned' : '');
    card.innerHTML =
      '<div class="wc-inner">' +
        '<div class="wc-face wc-front">' +
          '<div class="hz">' + esc(w.h) + '</div>' +
          '<div class="hint">нажми · 点击</div>' +
        '</div>' +
        '<div class="wc-face wc-back">' +
          '<div class="py">' + esc(w.p) + '</div>' +
          '<div class="ru">' + esc(w.t) + '</div>' +
        '</div>' +
      '</div>' +
      '<button class="wc-learn" type="button">' + (learnedSet[w.h] ? 'выучил ✓' : 'выучил') + '</button>';
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('wc-learn')) return;
      card.classList.toggle('flipped');
    });
    card.querySelector('.wc-learn').addEventListener('click', (e) => {
      e.stopPropagation();
      const set = state.learned[n] || (state.learned[n] = {});
      if (set[w.h]) delete set[w.h]; else set[w.h] = true;
      saveState();
      const count = L.words.filter(x => set[x.h]).length;
      updateWordsProgress(n, L, count);
      card.classList.toggle('learned', !!set[w.h]);
      const btn = card.querySelector('.wc-learn');
      btn.textContent = set[w.h] ? 'выучил ✓' : 'выучил';
      if (count === L.words.length) openLessonRefreshQuiz(n);
    });
    grid.appendChild(card);
  });
  updateWordsProgress(n, L, learnedCount);
}

function updateWordsProgress(n, L, count){
  const fill = document.getElementById('wpFill');
  const label = document.getElementById('wpLabel');
  if (fill) fill.style.width = Math.round(count / L.words.length * 100) + '%';
  if (label) label.textContent = count + ' / ' + L.words.length + ' выучено';
}

function openLessonRefreshQuiz(n){
  const L = LESSONS[n];
  const secs = document.querySelectorAll('#lessonView .sec');
  const sec = secs[3];
  if (!sec) return;
  sec.innerHTML =
    '<div class="sec-head"><span class="sh-hz">练习</span><span class="sh-ru">Тест-допуск к следующему уроку</span></div>' +
    '<div class="quiz-gate ready">' +
      '<div>Все слова выучены! Проверь себя: нужно ' + Math.ceil(L.quiz.length * 0.8) + ' правильных из ' + L.quiz.length + '.</div>' +
      '<button class="qg-btn" id="qgBtn">Начать тест</button>' +
    '</div>' +
    '<div class="quiz-body" id="quizBody">' +
      '<div class="q-progress" id="qProgress"></div>' +
      '<div class="q-text" id="qText"></div>' +
      '<div class="q-opts" id="qOpts"></div>' +
      '<div class="q-result" id="qResult" style="display:none"></div>' +
    '</div>';
  document.getElementById('qgBtn').addEventListener('click', () => startQuiz(n, L));
}

let quizN = null, quizQs = [], quizIdx = 0, quizRight = 0, quizAnswered = false;

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(n, L){
  quizN = n; quizIdx = 0; quizRight = 0; quizAnswered = false;
  quizQs = shuffle(L.quiz);
  document.getElementById('quizBody').classList.add('show');
  document.getElementById('qResult').style.display = 'none';
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const q = quizQs[quizIdx];
  quizAnswered = false;
  document.getElementById('qProgress').textContent = 'Вопрос ' + (quizIdx + 1) + ' / ' + quizQs.length;
  document.getElementById('qText').textContent = q.q;
  const optsEl = document.getElementById('qOpts');
  optsEl.innerHTML = '';
  shuffle(q.opts).forEach(opt => {
    const b = document.createElement('button');
    b.className = 'q-opt';
    b.textContent = opt;
    b.addEventListener('click', () => {
      if (quizAnswered) return;
      quizAnswered = true;
      const buttons = [...optsEl.children];
      buttons.forEach(x => x.disabled = true);
      if (opt === q.a) { b.classList.add('correct'); quizRight++; }
      else {
        b.classList.add('wrong');
        buttons.find(x => x.textContent === q.a)?.classList.add('correct');
      }
      setTimeout(() => {
        quizIdx++;
        if (quizIdx < quizQs.length) renderQuizQuestion();
        else finishQuiz();
      }, 750);
    });
    optsEl.appendChild(b);
  });
}

function finishQuiz(){
  const L = LESSONS[quizN];
  const need = Math.ceil(L.quiz.length * 0.8);
  const ok = quizRight >= need;
  const res = document.getElementById('qResult');
  res.style.display = 'block';
  res.innerHTML =
    '<div class="qr-score">' + quizRight + ' / ' + L.quiz.length + '</div>' +
    '<div class="qr-msg">' +
      (ok
        ? (quizN < 11 ? '测试通过！Урок сдан — следующий открыт!' : '恭喜！Ты прошёл все одиннадцать уроков!')
        : '需要复习。 Нужно хотя бы ' + need + ' из ' + L.quiz.length + ' — повтори слова и попробуй снова.') +
    '</div>' +
    '<button class="qr-btn" id="qrRetry">' + (ok ? 'Пройти ещё раз' : 'Попробовать снова') + '</button>';
  document.getElementById('qrRetry').addEventListener('click', () => startQuiz(quizN, L));

  if (ok && !state.passed[quizN]) {
    state.passed[quizN] = true;
    saveState();
    renderPath();
    document.getElementById('lvNext').classList.add('show');
  } else if (ok) {
    document.getElementById('lvNext').classList.add('show');
  }
}

function resetProgress(){
  state = { learned:{}, passed:{}, opened:1 };
  saveState();
  backToPath();
}

FUTURE.forEach(L => {
  const card = document.createElement('article');
  card.className = 'lesson';
  card.innerHTML =
    '<div class="num">' + L.n + '</div>' +
    '<div class="hz">' + L.hz + '</div>' +
    '<div class="py">' + L.py + '</div>' +
    '<div class="ru">' + L.ru + '</div>' +
    '<div class="topic">' + L.topic + '</div>' +
    '<div class="pages">' + L.pages + '</div>';
  futureLessons.appendChild(card);
});

document.querySelectorAll('.fade-in').forEach((el, i) => {
  setTimeout(() => el.classList.add('visible'), 110 * i + 100);
});

renderPath();
</script>

</button>

(function(){

if (window.parent !== window) {
  const dupBtn = document.getElementById('musicBtn');

  if (dupAudio) dupAudio.remove();
  document.querySelector('.back-home')?.addEventListener('click', (e) => {
    e.preventDefault();
    window.parent.postMessage('close-app', '*');
  });
}
</script>
